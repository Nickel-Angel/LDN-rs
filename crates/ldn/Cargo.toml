[package]
name = "ldn"
description = "Local wireless communication (LDN) with a Nintendo Switch: scan, join and host networks on Linux."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ldn-wire.workspace = true
ldn-crypto.workspace = true
ldn-proto.workspace = true
ldn-wlan.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
log.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }

[lints]
workspace = true
